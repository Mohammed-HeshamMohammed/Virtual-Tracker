<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Virtual Callers | Desktop Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <main class="agent-tray">
    <div class="scanline" aria-hidden="true"></div>

    <header class="titlebar">
      <div class="titlebar-drag pywebview-drag-region">
        <img class="titlebar-logo-img" src="app-icon.ico" width="16" height="16" alt="" />
        <span class="titlebar-label">Virtual Callers</span>
      </div>
      <div class="titlebar-controls">
        <button class="win-btn" id="btn-minimize" type="button" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn win-close" id="btn-close" type="button" title="Hide to tray" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="content">
      <section class="link-card">
        <div class="link-card-glow" aria-hidden="true"></div>
        <div class="link-card-inner">
          <div class="link-card-head">
            <h2 class="link-card-label">Local Link Status</h2>
            <div class="status-badge" id="link-badge">
              <span class="status-badge-dot" id="link-dot"></span>
              <span id="link-badge-text">Checking</span>
            </div>
          </div>
          <div class="link-card-body">
            <div class="link-server" id="link-server">Ext-Server: —</div>
            <div class="link-hint" id="link-hint">Syncing telemetry data in real-time.</div>
          </div>
          <div class="viz-bars" id="viz-bars" aria-hidden="true">
            <span class="viz-bar"></span><span class="viz-bar"></span><span class="viz-bar"></span>
            <span class="viz-bar"></span><span class="viz-bar"></span><span class="viz-bar"></span>
            <span class="viz-bar"></span><span class="viz-bar"></span><span class="viz-bar"></span>
          </div>
        </div>
      </section>

      <section class="session-card">
        <div class="avatar-wrap">
          <img class="avatar-img" id="avatar-img" alt="" hidden>
          <div class="avatar-fallback" id="avatar-fallback">?</div>
        </div>
        <div class="session-info">
          <span class="session-label">Agent Session</span>
          <span class="session-name" id="session-name">Not signed in</span>
        </div>
        <button class="session-login" id="btn-session-login" type="button" title="Sign in" aria-label="Sign in">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M11 7 9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5Zm9 12h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8v2h8v14Z"/>
          </svg>
        </button>
      </section>

      <nav class="actions">
        <button class="btn btn-primary" id="btn-signin" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm-9-2V8H4v2H2v2h2v2h2v-2h2v-2H6Zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/>
          </svg>
          <span id="btn-signin-label">Sign In</span>
        </button>
        <button class="btn btn-secondary" id="btn-open-app" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/>
          </svg>
          Open Dashboard
        </button>
        <button class="btn btn-tertiary" id="btn-hide" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l1.46 1.46A7.93 7.93 0 0 0 19 12c0-4.42-3.58-8-8-8-1.05 0-2.05.2-2.97.57l1.52 1.52C10.26 5.13 11.11 5 12 5c3.87 0 7 3.13 7 7 0 1.11-.26 2.16-.72 3.09l1.45 1.45A8.96 8.96 0 0 0 21 12c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c.83 0 1.62-.11 2.37-.32l-1.4-1.4c-.31.08-.64.12-.97.12-2.76 0-5-2.24-5-5s2.24-5 5-5Z"/>
          </svg>
          Hide to Tray
        </button>
      </nav>
    </div>

    <footer class="footer">
      <div class="footer-tools">
        <button class="footer-icon" id="btn-settings" type="button" title="Setup Launcher" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14.06 2h-3.88c-.24 0-.45.17-.49.41l-.36 2.54a7.03 7.03 0 0 0-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.05.24.25.41.49.41h3.88c.24 0 .44-.17.49-.41l.36-2.54c.58-.23 1.12-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/>
          </svg>
        </button>
        <button class="footer-icon" id="btn-help" type="button" title="Help" aria-label="Help">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M11 18h2v-2h-2v2Zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8Zm0-14c-2.21 0-4 1.79-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4Z"/>
          </svg>
        </button>
      </div>
      <span class="footer-version" id="footer-version">v0.2.0</span>
    </footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
