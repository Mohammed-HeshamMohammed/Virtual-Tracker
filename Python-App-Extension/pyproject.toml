[project]
name = "virtual-tracker-agent"
version = "0.2.0"
description = "Virtual Tracker Python desktop agent — screenshots, apps, URLs"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
  "pywebview>=5.1",
  "pystray>=0.19.5",
  "pillow>=10.0.0",
  "mss>=9.0.0",
  "psutil>=5.9.0",
  "pynput>=1.7.6",
  "requests>=2.31.0",
]

[project.scripts]
vt-agent = "vt_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vt_agent*"]
