# osv-scanner ignore list.
#
# Every entry below is transitive through Tauri's own dependency tree - gtk/glib
# and atk (the Linux webkit2gtk stack), xcb via xcap, urlpattern via tauri-utils,
# zbus via tauri-plugin-notification. None is declared directly in Cargo.toml,
# `cargo update` locks 0 packages for any of them, and the fixes live in major
# versions nothing in the tauri stack has moved to yet.
#
# The agent ships Windows and macOS; the GTK/X11 path is not built there.
#
# Re-check when tauri/wry move off webkit2gtk 4.1 - most of this list should
# disappear in one go. Do not add anything here that is a direct dependency.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "Transitive via the Tauri Linux GTK/X11 stack; no patched version reachable, and not built on the shipped Windows/macOS targets."

