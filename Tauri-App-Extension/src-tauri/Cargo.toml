[package]
name = "virtual-tracker-agent"
version = "0.4.17"
description = "Virtual Tracker Tauri desktop agent — screenshots, apps, URLs"
authors = ["Virtual Tracker"]
edition = "2021"

[lib]
name = "virtual_tracker_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon stays off on Linux: RUSTSEC-2024-0429 (unsound glib::VariantStrIter,
# unpatched upstream — fix landed only in glib >=0.20, which nothing in this
# stack has moved to yet) is unavoidable on Linux regardless, since wry's own
# webkit2gtk backend pulls the same vulnerable glib line — see release.yml for
# the accepted-risk decision. Disabling tray-icon doesn't remove the advisory,
# it just avoids adding one more call site (libappindicator's GVariant usage)
# into it, for zero functional loss on the other two platforms.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# "deep-link" feature: forwards the URL a second OS-spawned instance was
# launched with (Windows/Linux custom-scheme launch) to the deep-link
# plugin's on_open_url listener below, instead of only the raw argv this
# plugin already hands the single-instance callback.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.3"
tiny_http = "0.12"
urlencoding = "2"
parking_lot = "0.12"
dirs = "6"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
# MAC-1/F1: one cross-platform credential store (Windows Credential Manager,
# macOS Keychain, *nix Secret Service) behind a single Entry API. The `v1`
# feature is what unlocks that API; it declares the platform-store crates as
# its own target-gated optional deps, so only the store for the platform
# actually being built pulls in and links - no per-target split needed here.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security_Cryptography",
  # Locked/secure-desktop check before capturing a screenshot (screen.rs).
  "Win32_System_StationsAndDesktops",
] }
