[package]
name = "virtual-tracker-agent"
version = "1.1.16"
description = "My Virtual Tracker — desktop time tracking: screenshots, apps, URLs"
authors = ["My Virtual Tracker"]
edition = "2021"

[lib]
name = "virtual_tracker_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
strip = true
codegen-units = 1

# Two builds from one codebase (PLAN-windows-7-legacy-build.md):
# - default ("modern"): Windows 10 and 11, macOS, Linux.
# - `--no-default-features --features legacy-windows`: Windows 7, 8 and 8.1. Those
#   systems have no WinRT, and a binary that so much as imports it will not start
#   there, so the two crates that use WinRT are left out of it.
[features]
default = ["modern"]
modern = ["dep:tauri-plugin-notification", "dep:iana-time-zone"]
legacy-windows = ["dep:win7-notifications"]

# Tauri and its plugins are held on 2.11: Tauri 2.12 dropped Windows 7 (wry 0.57 moved
# to windows-rs 0.62, which links combase.dll), and the legacy build needs this line.
# CI checks the lockfile too (.github/scripts/assert-windows7-stack.mjs). Moving past
# 2.11 means giving the legacy build its own manifest and lockfile first.
[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# tray-icon stays off on Linux: RUSTSEC-2024-0429 (unsound glib::VariantStrIter,
# unpatched upstream — fix landed only in glib >=0.20, which nothing in this
# stack has moved to yet) is unavoidable on Linux regardless, since wry's own
# webkit2gtk backend pulls the same vulnerable glib line — see release.yml for
# the accepted-risk decision. Disabling tray-icon doesn't remove the advisory,
# it just avoids adding one more call site (libappindicator's GVariant usage)
# into it, for zero functional loss on the other two platforms.
tauri = { version = "~2.11", features = ["macos-private-api"] }
tauri-plugin-opener = "~2.5"
tauri-plugin-autostart = "~2.5"
# Same crate the autostart plugin wraps - used directly only to remove the
# start-at-login entry left under the pre-rename product name.
auto-launch = "0.5"
tauri-plugin-updater = "~2.11"
tauri-plugin-process = "~2.3"
# Windows 10/11 toasts are WinRT, so the legacy build has its own (see `features`).
tauri-plugin-notification = { version = "~2.4", optional = true }
tauri-plugin-global-shortcut = "~2.3"
# "deep-link" feature: forwards the URL a second OS-spawned instance was
# launched with (Windows/Linux custom-scheme launch) to the deep-link
# plugin's on_open_url listener below, instead of only the raw argv this
# plugin already hands the single-instance callback.
tauri-plugin-single-instance = { version = "~2.4", features = ["deep-link"] }
tauri-plugin-deep-link = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.3"
tiny_http = "0.12"
urlencoding = "2"
parking_lot = "0.13"
# The machine's IANA zone (e.g. "Africa/Cairo"), reported so the backend can
# book a session's hours to the right calendar day. Already in the tree
# transitively, so naming it directly adds no new code - just makes the
# dependency honest. Never used for timestamps: the server still stamps every
# session itself, so a wrong clock here cannot move tracked time.
# On Windows it asks WinRT, so the legacy build reads the zone from the window instead.
iana-time-zone = { version = "0.1", optional = true }
# Reading browser history databases as a URL fallback (capture/history.rs).
# `bundled` so we never depend on a system sqlite being present.
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
tempfile = "3"
# MAC-1/F1: one cross-platform credential store (Windows Credential Manager,
# macOS Keychain, *nix Secret Service) behind a single Entry API. The `v1`
# feature is what unlocks that API; it declares the platform-store crates as
# its own target-gated optional deps, so only the store for the platform
# actually being built pulls in and links - no per-target split needed here.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
# The legacy build's notifications: a small window drawn by the app, which Windows 7 can show.
win7-notifications = { version = "0.4.5", optional = true }
# The #[implement] macro expands to absolute ::windows_core paths, so the
# crate has to be in scope by that name as well as via windows::core.
windows-core = "0.58"
windows = { version = "0.58", features = [
  # COM callback for UIA value-changed events (capture/uia_url.rs).
  "implement",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # GetTickCount64, paired with GetLastInputInfo for OS-level idle (ID-5).
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security_Cryptography",
  # Locked/secure-desktop check before capturing a screenshot (screen.rs).
  "Win32_System_StationsAndDesktops",
  # In-process UI Automation for reading the browser address bar
  # (capture/uia_url.rs) - replaces the per-tick PowerShell subprocess.
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  # The hidden window that hears sleep and shutdown (power_events.rs).
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_Variant",
] }

# ctor 0.8.0 and dtor 0.3.0 (pulled in by tauri-utils) recognise Windows by the target's
# vendor being "pc", so they refuse the Windows 7 target (`*-win7-windows-msvc`, vendor
# "win7") and, worse, would leave its start-up constructors out. These copies add "win7"
# beside "pc" in those checks and change nothing else; no 0.8.x/0.3.x release has the fix
# (ctor 1.x has, but tauri-utils 2.9 requires 0.8). Drop them when Tauri moves off ctor 0.8.
# The app in front, asked of macOS directly (capture/window.rs). Both are already in the
# build through Tauri, at these versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[patch.crates-io]
ctor = { path = "patches/ctor-0.8.0" }
dtor = { path = "patches/dtor-0.3.0" }
