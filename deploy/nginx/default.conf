# Nginx alternative to Caddy (manual TLS via Certbot).
# Mount as /etc/nginx/conf.d/default.conf and set server_name to your API domain.

upstream vt_auth {
    server auth-backend:5712;
    keepalive 8;
}

upstream vt_dashboard {
    server dashboard-backend:5713;
    keepalive 16;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    # After certbot: listen 443 ssl; + ssl_certificate directives

    client_max_body_size 12m;

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Auth-Backend (authentication-only routes)
    location ~ ^/api/(v1/)?auth/(firebase-config|readiness|password-policy|validate-password|verify|resolve-sign-in-methods)$ {
        proxy_pass http://vt_auth;
        include /etc/nginx/proxy_params;
    }

    # Dashboard — remaining /api/auth/* (identity, profile, session-bootstrap, …)
    location ~ ^/api/(v1/)?auth/ {
        proxy_pass http://vt_dashboard;
        include /etc/nginx/proxy_params;
    }

    # Dashboard — WebSocket presence
    location /api/presence/ws {
        proxy_pass http://vt_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /monitor {
        proxy_pass http://vt_dashboard;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://vt_dashboard;
        include /etc/nginx/proxy_params;
    }
}
