name: virtual-tracker

services:
  auth-backend:
    build:
      context: ../Auth-Backend
      dockerfile: Dockerfile
    container_name: vt-auth-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5712"
    expose:
      - "5712"
    # volumes:
    #   - ./secrets/firebase-admin.local.json:/app/firebase-admin.local.json:ro
    networks:
      - vt-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5712/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  dashboard-backend:
    build:
      context: ../Dashboard-Backend
      dockerfile: Dockerfile
    container_name: vt-dashboard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5713"
    expose:
      - "5713"
    # volumes:
    #   - ./secrets/firebase-admin.local.json:/app/firebase-admin.local.json:ro
    networks:
      - vt-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5713/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  dashboard-web:
    build:
      context: ../Dashboard-Web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-}
        NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL:-}
    container_name: vt-dashboard-web
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - vt-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  landing-web:
    build:
      context: ../Landing-Web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_URL: ${APP_PUBLIC_URL}
    container_name: vt-landing-web
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    expose:
      - "3001"
    networks:
      - vt-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  gateway:
    image: caddy:2-alpine
    container_name: vt-gateway
    restart: unless-stopped
    depends_on:
      auth-backend:
        condition: service_healthy
      dashboard-backend:
        condition: service_healthy
      dashboard-web:
        condition: service_healthy
      landing-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-:80}
      APP_DOMAIN: ${APP_DOMAIN:-}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vt-internal

networks:
  vt-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
