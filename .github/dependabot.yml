# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm
  - package-ecosystem: "npm"
    directory: "/Auth-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Dashboard-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Dashboard-Web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Landing-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Landing-Web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Notify-backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Tauri-App-Extension"
    schedule:
      interval: "weekly"
    # Kept with the Rust side on Tauri 2.11 (see the cargo entry below).
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/Auth-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/Dashboard-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/Dashboard-Web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/Landing-Backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/Landing-Web"
    schedule:
      interval: "weekly"

  # Tauri / Rust
  - package-ecosystem: "cargo"
    directory: "/Tauri-App-Extension/src-tauri"
    schedule:
      interval: "weekly"
    # Held on Tauri 2.11 for the Windows 7, 8 and 8.1 build (Tauri 2.12 dropped Windows 7;
    # Tauri-App-Extension/PLAN-windows-7-legacy-build.md). Patch releases within the held
    # lines are still proposed; minor and major ones would only fail the lockfile guard.
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "wry"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tao"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "webview2-com"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
