name: release

on:
  push:
    tags:
      - "agent-v*"

jobs:
  release:
    # 2026-08: re-reviewed the prior Windows-only restriction (was: adding a
    # Linux runner re-opens the dismissed RUSTSEC-2024-0429 glib advisory,
    # Dependabot #43). Re-review found the advisory is real, unpatched
    # upstream (fixed only in glib >=0.20, which nothing in the wry/tauri/
    # gtk-rs stack has adopted yet), and unavoidable on Linux regardless of
    # any Cargo feature - it comes from wry's own webkit2gtk backend, not
    # just the tray icon. This is a known, accepted, ecosystem-wide gap in
    # every Tauri 2 Linux app today, not something specific to this repo.
    # Decision: ship Linux anyway. tray-icon is disabled for the Linux
    # target (src-tauri/Cargo.toml) as one small mitigation - it removes one
    # more call site into the advisory (libappindicator's GVariant usage)
    # for zero functional loss, though it does not remove the advisory
    # itself. Revisit dropping this note once wry/tauri ship a release built
    # against glib >=0.20.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        if: matrix.platform == 'ubuntu-latest'
        # No libayatana-appindicator3-dev/libgtk-3-dev tray deps here on
        # purpose - tray-icon is a non-Linux-only feature (see Cargo.toml),
        # so nothing in the build actually needs them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: install frontend deps
        working-directory: Tauri-App-Extension
        run: npm ci

      # Authenticode (SmartScreen / Avast). Without a purchased OV/EV code-signing
      # cert the Windows build ships NotSigned and AV heuristics treat the
      # screenshot + input-hook agent as PUA. Secrets are optional so forks
      # without a cert still build; set WINDOWS_CERTIFICATE (base64 PFX) +
      # WINDOWS_CERTIFICATE_PASSWORD in the repo to enable signing.
      # See https://v2.tauri.app/distribute/sign/windows/
      - name: import Windows Authenticode certificate
        if: matrix.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item certificate/certificate.pfx -Force
          $thumb = $cert.Thumbprint
          Write-Host "Imported certificate thumbprint $thumb"
          $env:THUMB = $thumb
          # Tauri reads certificateThumbprint from tauri.conf.json.
          node -e "const fs=require('fs');const p='Tauri-App-Extension/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle=j.bundle||{};j.bundle.windows=j.bundle.windows||{};j.bundle.windows.certificateThumbprint=process.env.THUMB;j.bundle.windows.digestAlgorithm=j.bundle.windows.digestAlgorithm||'sha256';j.bundle.windows.timestampUrl=j.bundle.windows.timestampUrl||'http://timestamp.digicert.com';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Tauri-App-Extension
          tagName: agent-v__VERSION__
          releaseName: "Agent v__VERSION__"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
