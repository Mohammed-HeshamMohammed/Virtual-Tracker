name: release

# Builds the next agent version (0.4.3 → 0.4.4 …) - manually, on demand.
# Landing-Backend serves installers from GitHub `releases/latest`, so a
# published release is live for /api/download within the backend's ~5 min
# metadata cache.
#
# Used to also trigger on every qualifying push to main - removed. A release
# builds all three platforms (Windows 2x / macOS 10x the Linux runner-minute
# cost), and this repo is private, so every one of those pushes was a real
# charge against a finite monthly minute quota regardless of whether the
# change was worth shipping on its own (a single-line CSS tweak or a
# Cargo.lock sync got the same full matrix build as a real feature). Releasing
# is now a deliberate action - run this workflow manually when main actually
# has something worth shipping.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: agent-release
  # No push trigger left to fire concurrently by accident - if this does run
  # twice in close succession now it's from two manual dispatches, and the
  # newer one should win rather than queue a second full paid matrix build
  # behind the first.
  cancel-in-progress: true

jobs:
  # Gates bump/release on the checks that were previously only ever run by
  # hand before a push - 81 existing #[test] fns in src-tauri and tsc/vite
  # never ran in CI, so a broken commit could reach bump -> tag -> a signed
  # 3-platform build before anyone noticed. Runs once on Linux rather than
  # per-platform: it's the cheapest runner (1x minute multiplier vs 2x
  # Windows / 10x macOS), and failing fast here skips those expensive
  # matrix builds entirely on a bad commit instead of burning them first.
  verify:
    runs-on: ubuntu-latest
    # Checks out and runs tests, nothing more. The other two jobs declare
    # contents:write because they push a tag and publish a release; this one
    # inherited the repo default, which is the only reason it had more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: cargo test
        working-directory: Tauri-App-Extension/src-tauri
        run: cargo test --locked

      - name: frontend typecheck, test, build
        working-directory: Tauri-App-Extension
        run: |
          npm ci
          npm run test
          npm run build

  bump:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Need a token that can push the version commit + tag back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump agent version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          CONF="Tauri-App-Extension/src-tauri/tauri.conf.json"
          PKG="Tauri-App-Extension/package.json"
          CARGO="Tauri-App-Extension/src-tauri/Cargo.toml"

          current=$(node -p "require('./${PKG}').version")
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP"; exit 1 ;;
          esac
          next="${major}.${minor}.${patch}"
          tag="agent-v${next}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — refusing to overwrite"
            exit 1
          fi

          echo "Bumping agent $current → $next ($BUMP)"

          node -e "
            const fs = require('fs');
            for (const p of ['${PKG}', '${CONF}']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '${next}';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          # Only the [package] version line — never touch dependency versions.
          sed -i -E "0,/^version = \"[0-9]+\\.[0-9]+\\.[0-9]+\"/s//version = \"${next}\"/" "$CARGO"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PKG" "$CONF" "$CARGO"
          git commit -m "chore(tauri-agent): bump version to ${next}"
          git tag -a "$tag" -m "Agent v${next}"
          git push origin HEAD:main
          git push origin "$tag"

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    # 2026-08: Linux runner accepted despite RUSTSEC-2024-0429 glib advisory
    # (ecosystem-wide wry/webkit2gtk gap; tray-icon disabled on Linux).
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      # secrets.* is not allowed inside step `if:` — expose a boolean flag here.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: install frontend deps
        working-directory: Tauri-App-Extension
        run: npm ci

      # Authenticode (SmartScreen / Avast). Optional — set WINDOWS_CERTIFICATE
      # (base64 PFX) + WINDOWS_CERTIFICATE_PASSWORD to enable.
      # https://v2.tauri.app/distribute/sign/windows/
      - name: import Windows Authenticode certificate
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item certificate/certificate.pfx -Force
          $thumb = $cert.Thumbprint
          Write-Host "Imported certificate thumbprint $thumb"
          $env:THUMB = $thumb
          node -e "const fs=require('fs');const p='Tauri-App-Extension/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle=j.bundle||{};j.bundle.windows=j.bundle.windows||{};j.bundle.windows.certificateThumbprint=process.env.THUMB;j.bundle.windows.digestAlgorithm=j.bundle.windows.digestAlgorithm||'sha256';j.bundle.windows.timestampUrl=j.bundle.windows.timestampUrl||'http://timestamp.digicert.com';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Tauri-App-Extension
          tagName: ${{ needs.bump.outputs.tag }}
          releaseName: "Agent v${{ needs.bump.outputs.version }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
