name: release

# Builds the next agent version (0.4.3 → 0.4.4 …) - manually, on demand.
# Landing-Backend serves installers from GitHub `releases/latest`, so a
# published release is live for /api/download within the backend's ~5 min
# metadata cache.
#
# Used to also trigger on every qualifying push to main - removed. A release
# builds four updater targets across three operating systems (Windows 2x /
# macOS 10x the Linux runner-minute
# cost), and this repo is private, so every one of those pushes was a real
# charge against a finite monthly minute quota regardless of whether the
# change was worth shipping on its own (a single-line CSS tweak or a
# Cargo.lock sync got the same full matrix build as a real feature). Releasing
# is now a deliberate action - run this workflow manually when main actually
# has something worth shipping.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        options: [patch, minor, major]
        default: patch
      existing_tag:
        description: Optional existing agent-vX.Y.Z tag to retry without another version bump
        type: string
        required: false
      require_windows_signing:
        description: Fail instead of publishing an unsigned Windows installer (off while in development - no Authenticode certificate yet; turn on once WINDOWS_CERTIFICATE is configured)
        type: boolean
        default: false

concurrency:
  group: agent-release
  # Never cancel after the bump job has pushed a tag: that leaves an incomplete
  # release and forces manual repair. A second dispatch queues behind the first.
  cancel-in-progress: false

jobs:
  # Gates bump/release on the checks that were previously only ever run by
  # hand before a push - 81 existing #[test] fns in src-tauri and tsc/vite
  # never ran in CI, so a broken commit could reach bump -> tag -> a signed
  # multi-platform build before anyone noticed. Runs once on Linux rather than
  # per-platform: it's the cheapest runner (1x minute multiplier vs 2x
  # Windows / 10x macOS), and failing fast here skips those expensive
  # matrix builds entirely on a bad commit instead of burning them first.
  verify:
    runs-on: ubuntu-latest
    # Checks out and runs tests, nothing more. The other two jobs declare
    # contents:write because they push a tag and publish a release; this one
    # inherited the repo default, which is the only reason it had more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: cargo test
        working-directory: Tauri-App-Extension/src-tauri
        run: cargo test --locked

      - name: frontend typecheck, test, build
        working-directory: Tauri-App-Extension
        run: |
          npm ci
          npm run test
          npm run build

      - name: assert updater uses the operating-system trust store
        run: node .github/scripts/assert-updater-platform-trust.mjs

      # A.4 step 4 / F.2. The updater only trusts a signature made by the
      # private half of the pubkey compiled into the app. Getting this wrong
      # publishes a latest.json every installed agent rejects - a hard stop
      # (§5.2), unrecoverable without touching each machine - so this must
      # fail here, before the paid matrix build.
      #
      # Logic lives in .github/scripts/assert-updater-key.mjs, not inline:
      # comparing raw keynum bytes at a fixed offset in the key/signature
      # blobs, not a hex string grepped from a comment - minisign does not
      # zero-pad the displayed id, and a signature's own comment does not
      # contain a key id at all. An earlier version of this check grepped for
      # one anyway and could never have passed, matching key or not.
      - name: assert the signing key matches the shipped pubkey (F.2)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty - updater artifacts cannot be signed."
            exit 1
          fi
          echo "updater-key-check" > /tmp/keycheck.txt
          npx --yes @tauri-apps/cli signer sign \
            --private-key "${TAURI_SIGNING_PRIVATE_KEY}" \
            --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            /tmp/keycheck.txt
          node .github/scripts/assert-updater-key.mjs /tmp/keycheck.txt.sig
  bump:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Need a token that can push the version commit + tag back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump agent version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          EXISTING_TAG: ${{ github.event.inputs.existing_tag || '' }}
        run: |
          set -euo pipefail
          CONF="Tauri-App-Extension/src-tauri/tauri.conf.json"
          PKG="Tauri-App-Extension/package.json"
          CARGO="Tauri-App-Extension/src-tauri/Cargo.toml"
          LOCK="Tauri-App-Extension/src-tauri/Cargo.lock"

          if [ -n "${EXISTING_TAG}" ]; then
            if ! [[ "${EXISTING_TAG}" =~ ^agent-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::existing_tag must look like agent-v1.2.3"
              exit 1
            fi
            if ! git rev-parse "refs/tags/${EXISTING_TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${EXISTING_TAG} does not exist"
              exit 1
            fi
            next="${EXISTING_TAG#agent-v}"
            tagged_version=$(git show "${EXISTING_TAG}:Tauri-App-Extension/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")
            if [ "${tagged_version}" != "${next}" ]; then
              echo "::error::Tag ${EXISTING_TAG} contains package version ${tagged_version}"
              exit 1
            fi
            echo "Retrying existing ${EXISTING_TAG}; no commit or tag will be created."
            echo "version=${next}" >> "$GITHUB_OUTPUT"
            echo "tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./${PKG}').version")
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP"; exit 1 ;;
          esac
          next="${major}.${minor}.${patch}"
          tag="agent-v${next}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — refusing to overwrite"
            exit 1
          fi

          echo "Bumping agent $current → $next ($BUMP)"

          node -e "
            const fs = require('fs');
            for (const p of ['${PKG}', '${CONF}']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '${next}';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          # Only the [package] version line — never touch dependency versions.
          sed -i -E "0,/^version = \"[0-9]+\\.[0-9]+\\.[0-9]+\"/s//version = \"${next}\"/" "$CARGO"

          # Cargo.lock pins our own package's version too (its [[package]]
          # block right after `name = "virtual-tracker-agent"`) - `verify`'s
          # `cargo test --locked` treats that as out of sync with Cargo.toml
          # otherwise and fails deterministically on every run from here on.
          sed -i -E "/^name = \"virtual-tracker-agent\"\$/{n;s/^version = \"[0-9]+\\.[0-9]+\\.[0-9]+\"/version = \"${next}\"/}" "$LOCK"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PKG" "$CONF" "$CARGO" "$LOCK"
          git commit -m "chore(tauri-agent): bump version to ${next}"
          git tag -a "$tag" -m "Agent v${next}"
          git push origin HEAD:main
          git push origin "$tag"

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    # 2026-08: Linux runner accepted despite RUSTSEC-2024-0429 glib advisory
    # (ecosystem-wide wry/webkit2gtk gap; tray-icon disabled on Linux).
    strategy:
      fail-fast: false
      # tauri-action updates latest.json with a delete-and-upload sequence.
      # Serial jobs prevent platforms racing and publishing a partial manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      # secrets.* is not allowed inside step `if:` — expose a boolean flag here.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      REQUIRE_WINDOWS_SIGNING: ${{ github.event.inputs.require_windows_signing != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: install frontend deps
        working-directory: Tauri-App-Extension
        run: npm ci

      - name: enforce Windows signing policy
        if: matrix.platform == 'windows-latest' && env.REQUIRE_WINDOWS_SIGNING == 'true' && env.HAS_WINDOWS_CERT != 'true'
        shell: pwsh
        run: |
          Write-Error "WINDOWS_CERTIFICATE is not configured. Re-run with require_windows_signing=false only for an explicitly approved unsigned release."
          exit 1

      # Authenticode (SmartScreen / Avast). Optional — set WINDOWS_CERTIFICATE
      # (base64 PFX) + WINDOWS_CERTIFICATE_PASSWORD to enable.
      # https://v2.tauri.app/distribute/sign/windows/
      - name: import Windows Authenticode certificate
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item certificate/certificate.pfx -Force
          $thumb = $cert.Thumbprint
          Write-Host "Imported certificate thumbprint $thumb"
          $env:THUMB = $thumb
          node -e "const fs=require('fs');const p='Tauri-App-Extension/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle=j.bundle||{};j.bundle.windows=j.bundle.windows||{};j.bundle.windows.certificateThumbprint=process.env.THUMB;j.bundle.windows.digestAlgorithm=j.bundle.windows.digestAlgorithm||'sha256';j.bundle.windows.timestampUrl=j.bundle.windows.timestampUrl||'http://timestamp.digicert.com';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Tauri-App-Extension
          tagName: ${{ needs.bump.outputs.tag }}
          releaseName: "Agent v${{ needs.bump.outputs.version }}"
          releaseDraft: false
          prerelease: false
          # productName is "My Virtual Tracker" - the space is fine for the
          # install folder, the Start Menu shortcut and every other local
          # bundle name (NSIS/MSI/deb/rpm/AppImage/dmg all built and signed
          # with it, unaffected by this), but tauri-action's default asset
          # naming just re-uses that name verbatim for the uploaded GitHub
          # Release asset, and the raw space in that upload request broke on
          # all three platforms at once - a 500 on macOS ("Unicorn!" page,
          # not a validation error), "Error saving asset" on Windows, "Error
          # uploading" on Linux after the .deb alone got through. This only
          # renames the uploaded copy (and, since assetNamePattern also
          # drives latest.json's own download URLs, the updater's manifest
          # stays consistent with it automatically) - Landing-Backend's own
          # picker (download-routes.js) matches by trailing extension only,
          # never by this prefix, so it needs no change for this.
          assetNamePattern: "My-Virtual-Tracker_v[version]_[platform]_[arch][ext]"
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  verify-release:
    needs: [bump, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: verify published manifest and live update endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          RELEASE_VERSION: ${{ needs.bump.outputs.version }}
          UPDATE_BASE_URL: https://api.myvirtualtracker.com
          REQUIRED_UPDATE_PLATFORMS: windows-x86_64,linux-x86_64,darwin-aarch64,darwin-x86_64
        run: node .github/scripts/verify-updater-release.mjs
