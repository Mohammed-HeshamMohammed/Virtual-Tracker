name: release

on:
  push:
    tags:
      - "agent-v*"

jobs:
  release:
    # 2026-08: re-reviewed the prior Windows-only restriction (was: adding a
    # Linux runner re-opens the dismissed RUSTSEC-2024-0429 glib advisory,
    # Dependabot #43). Re-review found the advisory is real, unpatched
    # upstream (fixed only in glib >=0.20, which nothing in the wry/tauri/
    # gtk-rs stack has adopted yet), and unavoidable on Linux regardless of
    # any Cargo feature - it comes from wry's own webkit2gtk backend, not
    # just the tray icon. This is a known, accepted, ecosystem-wide gap in
    # every Tauri 2 Linux app today, not something specific to this repo.
    # Decision: ship Linux anyway. tray-icon is disabled for the Linux
    # target (src-tauri/Cargo.toml) as one small mitigation - it removes one
    # more call site into the advisory (libappindicator's GVariant usage)
    # for zero functional loss, though it does not remove the advisory
    # itself. Revisit dropping this note once wry/tauri ship a release built
    # against glib >=0.20.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Linux webview deps
        if: matrix.platform == 'ubuntu-latest'
        # No libayatana-appindicator3-dev/libgtk-3-dev tray deps here on
        # purpose - tray-icon is a non-Linux-only feature (see Cargo.toml),
        # so nothing in the build actually needs them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: install frontend deps
        working-directory: Tauri-App-Extension
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Tauri-App-Extension
          tagName: agent-v__VERSION__
          releaseName: "Agent v__VERSION__"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
