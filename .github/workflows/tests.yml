name: tests

# Dashboard-Backend has 579 tests that, until this existed, only ran when
# somebody remembered to type `npm test` in that directory. The release
# workflow gates on the Tauri agent's tests but nothing gated on these, so a
# regression in reporting, limits or classification could reach production
# with the suite that covers it sitting green and unexecuted on a laptop.
#
# Unlike security.yml (deliberately report-only), this one is meant to fail a
# build - that is the entire point of it.
#
# Cheap on purpose: one ubuntu runner (1x minute multiplier), nine direct
# dependencies, no matrix. Roughly a minute a run.

on:
  push:
    branches: [main]
    paths:
      - "Dashboard-Backend/**"
      - "Tauri-App-Extension/src-tauri/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Dashboard-Backend/**"
      - "Tauri-App-Extension/src-tauri/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Dashboard-Backend/package-lock.json

      - name: install
        working-directory: Dashboard-Backend
        run: npm ci

      # `npm test` carries --experimental-test-module-mocks. Several suites
      # use mock.module, which is silently undefined without it - running
      # `node --test` directly reports "mock.module is not a function" and
      # looks like dozens of broken files rather than a missing flag.
      - name: test
        working-directory: Dashboard-Backend
        run: npm test

  # The agent's macOS branches were only ever compiled by the release
  # workflow, which means a break in them surfaced at the moment of shipping
  # rather than at the commit that caused it - and nobody working on this
  # codebase has a Mac to catch it earlier. `cargo check` per platform is
  # cheap compared with a full `tauri build` and catches the whole class:
  # a cfg(target_os) block that references a moved module, a renamed type,
  # or an API that only exists on the other platform.
  #
  # macOS runners bill at 10x, so this checks rather than builds, and only
  # when src-tauri actually changed.
  agent-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tauri-App-Extension/src-tauri

      # Tauri links against webkit2gtk/libsoup on Linux; without these the
      # check fails on a missing pkg-config file rather than on any code.
      - name: linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      # --all-targets so the test modules are checked too: they are the part
      # most likely to reference something a refactor moved.
      - name: cargo check
        working-directory: Tauri-App-Extension/src-tauri
        run: cargo check --all-targets --locked
